<!DOCTYPE html>
<html>
<head>
  <title>Quiz Extractor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 250px;
      padding: 15px;
      text-align: center;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
      width: 100%;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #progress {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Quiz Extractor</h2>
  <button id="startBtn">Start Extraction</button>
  <div id="progress">Ready</div>
  <script src="popup.js"></script>
</body>
</html>
